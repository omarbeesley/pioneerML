[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pioneer-purity"
version = "0.1.0"
description = "PURITY reconstruction and tail-reveal models for PIONEER"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch==2.7.0",
  "torch-geometric==2.7.0",
  "torch-cluster==1.6.3",
  "torch-scatter==2.1.2",
  "numpy==2.2.5",
  "pandas==3.0.2",
  "pyarrow==24.0.0",
  "scipy==1.17.1",
  "matplotlib==3.10.9",
  "tqdm==4.67.1",
]

[project.scripts]
purity = "purity.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
